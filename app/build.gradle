plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.jaimin.auraorbit'
    compileSdk rootProject.ext.androidCompileSdk

    defaultConfig {
        applicationId "dev.jaimin.auraorbit"
        minSdk rootProject.ext.androidMinSdk
        targetSdk rootProject.ext.androidTargetSdk
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    // ─── Multi-Version JDK Support with Automatic Selection ─────────────
    // Detects available JDK versions (17, 21, 25) and uses the highest.
    // Falls back to JDK 17 if higher versions are not available.
    compileOptions {
        def detectedJdk = detectAvailableJdk()
        sourceCompatibility detectedJdk
        targetCompatibility detectedJdk
    }

    // Prevent compression of libGDX native libs
    androidResources {
        noCompress 'so'
    }

    packaging {
        // Avoid duplicate META-INF entries from libGDX transitive deps
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// ─── JDK Version Detection ────────────────────────────────────────────────
def detectAvailableJdk() {
    // Priority order: JDK 25 > JDK 21 > JDK 17
    def jdkVersions = ['25', '21', '17']
    
    for (version in jdkVersions) {
        def javaHome = System.getenv("JAVA_HOME_${version}")
        if (javaHome) {
            logger.lifecycle("✓ Detected JDK ${version} at ${javaHome}")
            return getJavaVersion(version)
        }
    }
    
    // Fallback to system Java if detection fails
    def systemJavaVersion = System.getProperty("java.version")
    logger.lifecycle("⚠ Using system JDK: ${systemJavaVersion}")
    return JavaVersion.VERSION_17
}

def getJavaVersion(String version) {
    switch(version) {
        case '25': return JavaVersion.VERSION_25
        case '21': return JavaVersion.VERSION_21
        default: return JavaVersion.VERSION_17
    }
}

configurations { natives }

dependencies {
    def gdxVersion = rootProject.ext.gdxVersion

    // ─── libGDX Core ────────────────────────────────────────────────────
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"

    // ─── libGDX Android Backend (includes Live Wallpaper support) ──────
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"

    // ─── libGDX Android Native Libs (arm64, x86_64) ───────────────────
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"

    // ─── AndroidX ──────────────────────────────────────────────────────
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'

    // ─── Settings UI / Activity Result APIs ───────────────────────────
    implementation 'androidx.activity:activity:1.9.3'

    // ─── Device Info & System Properties ──────────────────────────────
    implementation 'androidx.core:core:1.12.0'

    // ─── Unit tests (GroupStore runs on host JVM; org.json is stubbed
    //     in android.jar, so pull the real artifact for tests) ─────────
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}


tasks.register('copyNatives') {
    doFirst {
        file("src/main/jniLibs").mkdirs()
        configurations.natives.files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("src/main/jniLibs/arm64-v8a")
            if (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("src/main/jniLibs/armeabi-v7a")
            if (jar.name.endsWith("natives-x86_64.jar")) outputDir = file("src/main/jniLibs/x86_64")
            if (jar.name.endsWith("natives-x86.jar")) outputDir = file("src/main/jniLibs/x86")
            
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name.contains('merge') && task.name.contains('JniLibFolders')) {
        task.dependsOn 'copyNatives'
    }
}
